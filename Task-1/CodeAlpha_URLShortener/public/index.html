<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Shortener | CodeAlpha</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #f5f7fa, #e8ecf3);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #222;
    }

    .container {
        width: 100%;
        max-width: 720px;
        background: white;
        border-radius: 20px;
        padding: 45px;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        text-align: center;
    }

    .badge {
        display: inline-block;
        background: #222;
        color: white;
        padding: 7px 14px;
        border-radius: 50px;
        font-size: 13px;
        margin-bottom: 18px;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 12px;
        letter-spacing: -1px;
    }

    .subtitle {
        color: #666;
        font-size: 17px;
        line-height: 1.6;
        margin-bottom: 32px;
    }

    .form {
        display: flex;
        gap: 12px;
    }

    input {
        flex: 1;
        padding: 16px 18px;
        border: 2px solid #e2e2e2;
        border-radius: 12px;
        font-size: 16px;
        outline: none;
        transition: 0.2s;
    }

    input:focus {
        border-color: #222;
    }

    button {
        border: none;
        background: #222;
        color: white;
        padding: 0 28px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #444;
        transform: translateY(-1px);
    }

    .result {
        display: none;
        margin-top: 28px;
        padding: 22px;
        background: #f6f6f6;
        border-radius: 14px;
        text-align: left;
    }

    .result-title {
        font-size: 15px;
        color: #666;
        margin-bottom: 8px;
    }

    .short-url {
        display: block;
        color: #222;
        font-size: 18px;
        font-weight: bold;
        word-break: break-all;
        margin-bottom: 16px;
    }

    .copy-btn {
        width: 100%;
        height: 48px;
    }

    .message {
        margin-top: 14px;
        font-size: 14px;
        color: #d33;
    }

    .footer {
        margin-top: 30px;
        color: #999;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        .container {
            padding: 30px 20px;
        }

        h1 {
            font-size: 32px;
        }

        .form {
            flex-direction: column;
        }

        button {
            height: 52px;
        }
    }
</style>

</head>

<body>
<div class="container">

    <span class="badge">CodeAlpha Internship Project</span>

    <h1>URL Shortener</h1>

    <p class="subtitle">
        Convert long URLs into short and easy-to-share links.
    </p>

    <form class="form" id="shortenForm">

        <input
            type="url"
            id="longUrl"
            placeholder="Enter your long URL..."
            required
        >

        <button type="submit">
            Shorten
        </button>

    </form>

    <div class="result" id="result">

        <p class="result-title">
            Your shortened URL:
        </p>

        <a
            href="#"
            id="shortUrl"
            class="short-url"
            target="_blank"
        ></a>

        <button
            type="button"
            class="copy-btn"
            id="copyButton"
        >
            Copy URL
        </button>

    </div>

    <p class="message" id="message"></p>

    <p class="footer">
        Built with HTML, CSS, JavaScript, Node.js, Express & SQLite
    </p>

</div>

<script>
    const form = document.getElementById("shortenForm");
    const longUrl = document.getElementById("longUrl");
    const result = document.getElementById("result");
    const shortUrl = document.getElementById("shortUrl");
    const copyButton = document.getElementById("copyButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const url = longUrl.value.trim();

        if (!url) {
            return;
        }

        message.textContent = "";
        result.style.display = "none";

        try {
            const response = await fetch("/shorten", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    longUrl: url
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Something went wrong");
            }

            shortUrl.href = data.shortUrl;
            shortUrl.textContent = data.shortUrl;

            result.style.display = "block";

        } catch (error) {
            message.textContent = error.message;
        }
    });

    copyButton.addEventListener("click", async () => {

        try {
            await navigator.clipboard.writeText(shortUrl.textContent);

            copyButton.textContent = "Copied!";

            setTimeout(() => {
                copyButton.textContent = "Copy URL";
            }, 1500);

        } catch (error) {
            message.textContent = "Unable to copy URL.";
        }
    });
</script>

</body>
</html>
